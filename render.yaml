services:
  - type: web
    name: mapa-webcams-espana
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webcams-db
          property: connectionString
      - key: PGSSL
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false

databases:
  - name: webcams-db
    databaseName: webcams
    user: webcams_user
    plan: basic-256mb
    region: frankfurt
